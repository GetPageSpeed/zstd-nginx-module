name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  dynamic-debian12:
    runs-on: ubuntu-latest
    env:
      NGINX_VERSION: release-1.30.4

    steps:
      - uses: actions/checkout@v4

      - name: Build dynamic modules on Debian 12
        run: make test-dynamic-debian12 NGINX_VERSION=${NGINX_VERSION}

  test:
    runs-on: ubuntu-latest
    env:
      NGINX_VERSION: release-1.30.4

    steps:
      - uses: actions/checkout@v4

      - name: Build base image
        run: make base-image NGINX_VERSION=${NGINX_VERSION}

      - name: Run test suite
        run: make tests NGINX_VERSION=${NGINX_VERSION}

  test-asan:
    runs-on: ubuntu-latest
    env:
      NGINX_VERSION: release-1.30.4

    steps:
      - uses: actions/checkout@v4

      - name: Build base image
        run: make base-image NGINX_VERSION=${NGINX_VERSION}

      # Rebuilds nginx with the module linked in statically under
      # -fsanitize=address; a dynamic module loaded into a non-ASAN nginx
      # cannot be sanitized. Fails on any sanitizer report even if prove passed.
      - name: Run test suite under AddressSanitizer
        run: make tests-asan NGINX_VERSION=${NGINX_VERSION}
