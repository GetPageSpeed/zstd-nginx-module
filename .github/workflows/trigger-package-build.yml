name: Trigger Package Builds

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  trigger-rpm-build:
    name: Trigger RPM Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yml2spec-nginx-module pipeline in myci
        run: |
          curl --fail-with-body --silent --show-error \
            --user "danila:${MYCI_PASSWORD}" \
            --header "Content-Type: application/json" \
            --data '{
              "repo": "danila_vershinin/yml2spec-nginx-module",
              "branch": "master",
              "parameters": {
                "run_matrix": false,
                "module_path": "modules/zstd.yml"
              }
            }' \
            https://ci.getpagespeed.com/api/builds
        env:
          MYCI_PASSWORD: ${{ secrets.MYCI_PASSWORD }}

  trigger-deb-build:
    name: Trigger DEB Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yml2deb-nginx-module pipeline in myci
        run: |
          curl --fail-with-body --silent --show-error \
            --user "danila:${MYCI_PASSWORD}" \
            --header "Content-Type: application/json" \
            --data '{
              "repo": "danila_vershinin/yml2deb-nginx-module",
              "branch": "main",
              "parameters": {
                "run_matrix": false,
                "module_path": "modules/zstd.yml"
              }
            }' \
            https://ci.getpagespeed.com/api/builds
        env:
          MYCI_PASSWORD: ${{ secrets.MYCI_PASSWORD }}
